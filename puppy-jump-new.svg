<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#fecf4f"/>
      <stop offset="1" stop-color="#2d3436"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sunsetSky)"/>

  <!-- sun -->
  <circle cx="360" cy="50" r="40" fill="#ffd93a" opacity="0.8"/>

  <!-- distant hills -->
  <path d="M 0 340 Q 150 300 350 340 L 400 340 L 0 400 Z" fill="#1e2a3a"/>

  <!-- grass silhouette -->
  <path d="M 0 380 Q 100 350 200 380 Q 300 360 400 380 L 400 400 L 0 400 Z" fill="#2c3e50"/>

  <!-- motion trails -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 80 230 q 18 -10 35 -6"/>
    <path d="M 90 270 q 16 -8 30 -4"/>
    <path d="M 70 310 q 20 -5 38 -2"/>
  </g>

  <!-- puppy mid-jump (side view) -->
  <g transform="translate(0 -20)">
    <!-- tail -->
    <path d="M 130 240 Q 100 220 95 180" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <!-- back legs stretched back -->
    <path d="M 140 260 Q 110 280 95 305" fill="none" stroke="#f4f6f8" stroke-width="18" stroke-linecap="round"/>
    <path d="M 155 270 Q 135 300 130 320" fill="none" stroke="#e8ecf0" stroke-width="17" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="185" cy="260" rx="60" ry="38" fill="#ffffff" transform="rotate(-15 185 260)"/>
    <ellipse cx="188" cy="278" rx="44" ry="20" fill="#eef1f4" opacity="0.8" transform="rotate(-15 188 278)"/>

    <!-- front legs reaching forward -->
    <path d="M 240 255 Q 275 240 300 220" fill="none" stroke="#f4f6f8" stroke-width="18" stroke-linecap="round"/>
    <path d="M 230 270 Q 255 275 275 260" fill="none" stroke="#e8ecf0" stroke-width="16" stroke-linecap="round"/>

    <!-- collar -->
    <path d="M 230 210 Q 250 220 260 235" fill="none" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>

    <!-- ears -->
    <ellipse cx="250" cy="150" rx="14" ry="30" fill="#f0f0f0" transform="rotate(-25 250 150)"/>
    <ellipse cx="285" cy="145" rx="12" ry="26" fill="#e8e8e8" transform="rotate(15 285 145)"/>

    <!-- head -->
    <circle cx="270" cy="190" r="35" fill="#ffffff"/>

    <!-- muzzle -->
    <ellipse cx="300" cy="200" rx="18" ry="14" fill="#ffffff"/>
    <circle cx="310" cy="194" r="5" fill="#333333"/>

    <!-- eye -->
    <circle cx="278" cy="182" r="5.5" fill="#333333"/>
    <circle cx="280" cy="180" r="1.8" fill="#ffffff"/>

    <!-- nose -->
    <circle cx="288" cy="208" r="4" fill="#333333"/>

    <!-- open mouth and tongue -->
    <path d="M 295 215 Q 310 230 325 215" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 300 218 Q 305 235 312 222" fill="#ff6b6b"/>
  </g>
</svg>