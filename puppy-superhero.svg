<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec1f4"/>
      <stop offset="0.4" stop-color="#f1f6f8"/>
      <stop offset="1" stop-color="#e0f7fa"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#heroSky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="70" cy="55" rx="40" ry="14"/>
    <ellipse cx="98" cy="48" rx="28" ry="12"/>
    <ellipse cx="320" cy="70" rx="35" ry="14"/>
    <ellipse cx="344" cy="62" rx="24" ry="11"/>
  </g>

  <!-- city skyline -->
  <g fill="#cfd8dc" opacity="0.6">
    <rect x="20" y="320" width="16" height="40"/>
    <rect x="38" y="305" width="14" height="55"/>
    <rect x="60" y="310" width="18" height="50"/>
    <rect x="300" y="315" width="16" height="45"/>
    <rect x="320" y="295" width="20" height="65"/>
    <rect x="360" y="325" width="12" height="35"/>
  </g>

  <!-- ground -->
  <ellipse cx="200" cy="410" rx="260" ry="85" fill="#789e4f"/>
  <rect y="355" width="400" height="45" fill="#789e4f"/>
  <ellipse cx="200" cy="362" rx="70" ry="9" fill="#5a7f3c" opacity="0.55"/>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 70 215 q 17 -9 34 -7"/>
    <path d="M 60 255 q 18 -7 36 -5"/>
    <path d="M 65 295 q 16 -5 32 -3"/>
  </g>

  <!-- hero cape billowing -->
  <g opacity="0.85">
    <path d="M 230 205 Q 210 165 215 130 Q 175 95 150 110 Q 130 165 160 210 Q 120 280 165 320 Q 200 280 230 205 Z" fill="#e53935"/>
    <path d="M 162 115 Q 175 135 188 115" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- puppy hero mid-jump -->
  <g transform="translate(0 -22)">
    <!-- tail -->
    <path d="M 130 235 Q 100 215 95 175" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <!-- back legs -->
    <path d="M 140 265 Q 115 285 105 310" fill="none" stroke="#f4f6f8" stroke-width="17" stroke-linecap="round"/>
    <path d="M 155 275 Q 140 305 140 325" fill="none" stroke="#e8ecf0" stroke-width="16" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="185" cy="255" rx="58" ry="36" fill="#ffffff" transform="rotate(-12 185 255)"/>
    <ellipse cx="188" cy="268" rx="42" ry="19" fill="#eef1f4" opacity="0.8" transform="rotate(-12 188 268)"/>

    <!-- cape shoulder -->
    <ellipse cx="230" cy="235" rx="16" ry="24" fill="#e53935" opacity="0.85"/>

    <!-- front legs -->
    <path d="M 235 250 Q 270 232 292 212" fill="none" stroke="#f4f6f8" stroke-width="17" stroke-linecap="round"/>
    <path d="M 226 265 Q 254 262 272 250" fill="none" stroke="#e8ecf0" stroke-width="15" stroke-linecap="round"/>

    <!-- collar with hero badge -->
    <path d="M 228 215 Q 245 225 252 240" fill="none" stroke="#1e88e5" stroke-width="9" stroke-linecap="round"/>
    <polygon points="240,225 235,235 245,235" fill="#ffd93a" stroke="#f9a825" stroke-width="2"/>

    <!-- ears -->
    <ellipse cx="248" cy="170" rx="13" ry="26" fill="#eef1f4" transform="rotate(-30 248 170)"/>
    <ellipse cx="278" cy="165" rx="12" ry="24" fill="#e8ecf0" transform="rotate(18 278 165)"/>

    <!-- head -->
    <circle cx="265" cy="205" r="32" fill="#ffffff"/>
    <ellipse cx="289" cy="216" rx="15" ry="11" fill="#ffffff"/>

    <!-- mask -->
    <path d="M 265 190 Q 265 185 275 182 Q 288 180 295 188 Q 295 210 285 215 Q 275 218 265 215 Z" fill="#1a237e" opacity="0.8"/>
    <circle cx="280" cy="198" r="4.5" fill="#ffffff"/>
    <circle cx="282" cy="197" r="1.5" fill="#ff5252"/>

    <!-- muzzle -->
    <circle cx="299" cy="210" r="5" fill="#2d2d2d"/>
    <path d="M 295 212 Q 308 230 320 212" fill="none" stroke="#2d2d2d" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>