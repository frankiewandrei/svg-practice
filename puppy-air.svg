<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5dcf7"/>
      <stop offset="1" stop-color="#e3f5fd"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- sun -->
  <circle cx="60" cy="60" r="26" fill="#ffe27a"/>
  <g stroke="#ffe27a" stroke-width="4" stroke-linecap="round">
    <path d="M 60 22 v -10"/>
    <path d="M 60 98 v 10"/>
    <path d="M 22 60 h -10"/>
    <path d="M 98 60 h 10"/>
    <path d="M 33 33 l -7 -7"/>
    <path d="M 87 87 l 7 7"/>
    <path d="M 87 33 l 7 -7"/>
    <path d="M 33 87 l -7 7"/>
  </g>

  <!-- ground -->
  <rect y="360" width="400" height="40" fill="#79c25f"/>
  <ellipse cx="200" cy="366" rx="70" ry="8" fill="#5da24d" opacity="0.6"/>

  <!-- motion lines on both sides -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 110 200 q -14 10 -16 26"/>
    <path d="M 290 200 q 14 10 16 26"/>
    <path d="M 100 260 q -12 6 -14 16"/>
    <path d="M 300 260 q 12 6 14 16"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff3a0">
    <path d="M 90 120 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 z"/>
    <path d="M 315 140 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 z"/>
    <path d="M 330 230 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 z"/>
  </g>

  <!-- tail -->
  <path d="M 252 268 Q 292 250 296 210" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- back legs splayed out -->
  <path d="M 158 262 Q 128 278 116 306" fill="none" stroke="#f4f4f4" stroke-width="18" stroke-linecap="round"/>
  <path d="M 242 262 Q 272 278 284 306" fill="none" stroke="#ececec" stroke-width="18" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="200" cy="252" rx="56" ry="46" fill="#ffffff"/>
  <ellipse cx="200" cy="266" rx="38" ry="28" fill="#f2f2f2" opacity="0.8"/>

  <!-- front paws reaching forward -->
  <ellipse cx="163" cy="296" rx="17" ry="21" fill="#ffffff"/>
  <ellipse cx="237" cy="296" rx="17" ry="21" fill="#f4f4f4"/>

  <!-- collar with tag -->
  <path d="M 158 208 Q 200 226 242 208" fill="none" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="200" cy="222" r="7" fill="#f1c40f" stroke="#d4a017" stroke-width="2"/>

  <!-- ears flopping outward -->
  <ellipse cx="148" cy="112" rx="16" ry="34" fill="#f0f0f0" transform="rotate(-32 148 112)"/>
  <ellipse cx="252" cy="112" rx="16" ry="34" fill="#e6e6e6" transform="rotate(32 252 112)"/>
  <ellipse cx="148" cy="116" rx="8" ry="22" fill="#ffc9d1" transform="rotate(-32 148 116)"/>
  <ellipse cx="252" cy="116" rx="8" ry="22" transform="rotate(32 252 116)"/>

  <!-- head -->
  <circle cx="200" cy="150" r="46" fill="#ffffff"/>

  <!-- eyes -->
  <circle cx="181" cy="142" r="6" fill="#333333"/>
  <circle cx="219" cy="142" r="6" fill="#333333"/>
  <circle cx="183" cy="140" r="2" fill="#ffffff"/>
  <circle cx="221" cy="140" r="2" fill="#ffffff"/>

  <!-- blush -->
  <circle cx="168" cy="162" r="7" fill="#ffd3da" opacity="0.8"/>
  <circle cx="232" cy="162" r="7" fill="#ffd3da" opacity="0.8"/>

  <!-- nose -->
  <ellipse cx="200" cy="160" rx="8" ry="6" fill="#333333"/>

  <!-- open mouth and tongue -->
  <path d="M 184 168 Q 200 186 216 168 Q 200 174 184 168 z" fill="#8a5a4a"/>
  <path d="M 191 171 Q 200 192 209 171 Q 200 177 191 171 z" fill="#ff9aa2"/>
</svg>
