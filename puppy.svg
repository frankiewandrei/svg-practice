<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- sky background -->
  <rect width="400" height="400" fill="#aee3f5"/>
  <circle cx="330" cy="70" r="30" fill="#fff6b0"/>
  <!-- ground -->
  <ellipse cx="200" cy="380" rx="180" ry="18" fill="#7cc46a"/>
  <!-- shadow -->
  <ellipse cx="200" cy="372" rx="60" ry="8" fill="#5da24d" opacity="0.6"/>

  <g>
    <!-- tail -->
    <path d="M 300 210 Q 340 190 345 150" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <!-- back leg -->
    <path d="M 285 240 Q 320 260 325 295" fill="none" stroke="#f4f4f4" stroke-width="18" stroke-linecap="round"/>
    <!-- back leg 2 -->
    <path d="M 265 245 Q 280 285 265 310" fill="none" stroke="#e8e8e8" stroke-width="16" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="220" cy="230" rx="75" ry="45" fill="#ffffff"/>

    <!-- front leg -->
    <path d="M 165 235 Q 140 255 130 235" fill="none" stroke="#f4f4f4" stroke-width="17" stroke-linecap="round"/>
    <!-- front leg 2 -->
    <path d="M 180 245 Q 165 270 150 265" fill="none" stroke="#e8e8e8" stroke-width="15" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="145" cy="195" r="38" fill="#ffffff"/>

    <!-- ears -->
    <ellipse cx="120" cy="160" rx="14" ry="28" fill="#f0f0f0" transform="rotate(-20 120 160)"/>
    <ellipse cx="172" cy="165" rx="12" ry="26" fill="#e8e8e8" transform="rotate(15 172 165)"/>

    <!-- eye -->
    <circle cx="132" cy="190" r="5" fill="#333333"/>
    <circle cx="134" cy="188" r="1.5" fill="#ffffff"/>

    <!-- nose -->
    <circle cx="108" cy="205" r="6" fill="#333333"/>

    <!-- mouth -->
    <path d="M 110 212 Q 118 220 128 215" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>

    <!-- tongue -->
    <path d="M 116 218 Q 120 230 126 220" fill="#ff9aa2"/>
  </g>
</svg>
